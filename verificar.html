<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subsight — Verificação</title>
  <link rel="stylesheet" href="web/estilos.css" />
</head>
<body>
  <div class="formas-bauhaus" aria-hidden="true">
    <span class="fb-triangulo"></span>
    <span class="fb-quadrado"></span>
    <span class="fb-circulo"></span>
    <span class="fb-linha"></span>
  </div>

  <header>
    <div class="cabecalho-marca">
      <svg class="marca-bauhaus" viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">
        <circle cx="13" cy="13" r="10" fill="var(--ss-destaque)" />
        <rect x="19" y="19" width="16" height="16" fill="#000" />
        <polygon points="31,3 39,19 23,19" fill="none" stroke="#000" stroke-width="2" />
      </svg>
      <strong>Subsight</strong>
    </div>
    <nav>
      <a href="index.html">Meus documentos</a>
    </nav>
  </header>

  <main>
    <div id="carregando" class="vazio">Verificando…</div>

    <div id="resultado" class="selo" hidden>
      <div class="selo-icone"><img class="icone" id="v-icone-img" src="web/icons/shield-check.svg" alt="" /></div>
      <div class="selo-titulo" id="v-titulo">—</div>
      <div class="selo-subtitulo" id="v-subtitulo">—</div>
      <div class="selo-grade">
        <div class="selo-campo"><div class="rotulo">Estado</div><div class="valor" id="v-estado">—</div></div>
        <div class="selo-campo"><div class="rotulo">Assinaturas</div><div class="valor" id="v-assinaturas">—</div></div>
        <div class="selo-campo"><div class="rotulo">Íntegro</div><div class="valor" id="v-integro">—</div></div>
        <div class="selo-campo"><div class="rotulo">Válido</div><div class="valor" id="v-valido">—</div></div>
      </div>
    </div>

    <div id="nao-encontrado" class="selo selo-erro" hidden>
      <div class="selo-icone"><img class="icone" src="web/icons/lock-01.svg" alt="" /></div>
      <div class="selo-titulo">Documento não encontrado</div>
      <div class="selo-subtitulo">Não existe documento com este código no Subsight.</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://projetoempresaficticia.github.io/pp-base/web/comum.js"></script>
  <script src="verificar.js"></script>
</body>
</html>
