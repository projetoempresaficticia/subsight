<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subsight — Verificação</title>
  <link rel="stylesheet" href="web/estilos.css" />
</head>
<body>
  <div class="app-shell">
  <header>
    <div class="cabecalho-marca">
      <div class="icone-app" aria-hidden="true">
        <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="bh-c00"><rect x="0" y="0" width="80" height="80" /></clipPath>
            <clipPath id="bh-c10"><rect x="80" y="0" width="80" height="80" /></clipPath>
            <clipPath id="bh-c20"><rect x="160" y="0" width="80" height="80" /></clipPath>
            <clipPath id="bh-c01"><rect x="0" y="80" width="80" height="80" /></clipPath>
            <clipPath id="bh-c11"><rect x="80" y="80" width="80" height="80" /></clipPath>
            <clipPath id="bh-c21"><rect x="160" y="80" width="80" height="80" /></clipPath>
            <clipPath id="bh-c02"><rect x="0" y="160" width="80" height="80" /></clipPath>
            <clipPath id="bh-c12"><rect x="80" y="160" width="80" height="80" /></clipPath>
            <clipPath id="bh-c22"><rect x="160" y="160" width="80" height="80" /></clipPath>
          </defs>
          <rect x="0" y="0" width="80" height="80" fill="#000" />
          <g clip-path="url(#bh-c10)"><circle cx="80" cy="0" r="80" fill="var(--ss-destaque)" /></g>
          <g clip-path="url(#bh-c20)"><circle cx="200" cy="80" r="40" fill="var(--ss-secundario)" /></g>
          <g clip-path="url(#bh-c01)"><circle cx="80" cy="120" r="40" fill="var(--ss-secundario)" /></g>
          <g clip-path="url(#bh-c11)"><circle cx="160" cy="160" r="80" fill="var(--ss-destaque-escuro)" /></g>
          <g clip-path="url(#bh-c21)"><circle cx="160" cy="160" r="80" fill="var(--ss-destaque)" /></g>
          <polygon points="0,240 80,240 80,160" fill="#000" />
          <rect x="80" y="160" width="80" height="80" fill="var(--ss-fundo-suave)" stroke="var(--ss-borda)" />
          <g clip-path="url(#bh-c22)"><circle cx="240" cy="160" r="80" fill="var(--ss-destaque-escuro)" /></g>
        </svg>
      </div>
      <strong>Subsight</strong>
    </div>
    <nav>
      <a href="index.html">Meus documentos</a>
    </nav>
  </header>

  <main>
    <div id="carregando" class="vazio">Verificando…</div>

    <div id="resultado" class="selo" hidden>
      <div class="selo-icone"><img class="icone" id="v-icone-img" src="web/icons/shield-check.svg" alt="" /></div>
      <div class="selo-titulo" id="v-titulo">—</div>
      <div class="selo-subtitulo" id="v-subtitulo">—</div>
      <div class="selo-grade">
        <div class="selo-campo"><div class="rotulo">Estado</div><div class="valor" id="v-estado">—</div></div>
        <div class="selo-campo"><div class="rotulo">Assinaturas</div><div class="valor" id="v-assinaturas">—</div></div>
        <div class="selo-campo"><div class="rotulo">Íntegro</div><div class="valor" id="v-integro">—</div></div>
        <div class="selo-campo"><div class="rotulo">Válido</div><div class="valor" id="v-valido">—</div></div>
      </div>
    </div>

    <div id="nao-encontrado" class="selo selo-erro" hidden>
      <div class="selo-icone"><img class="icone" src="web/icons/lock-01.svg" alt="" /></div>
      <div class="selo-titulo">Documento não encontrado</div>
      <div class="selo-subtitulo">Não existe documento com este código no Subsight.</div>
    </div>
  </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://projetoempresaficticia.github.io/pp-base/web/comum.js"></script>
  <script src="verificar.js"></script>
</body>
</html>
