<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subsight</title>
  <link rel="stylesheet" href="web/estilos.css" />
</head>
<body>
  <div class="formas-bauhaus" aria-hidden="true">
    <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="bh-c00"><rect x="0" y="0" width="80" height="80" /></clipPath>
          <clipPath id="bh-c10"><rect x="80" y="0" width="80" height="80" /></clipPath>
          <clipPath id="bh-c20"><rect x="160" y="0" width="80" height="80" /></clipPath>
          <clipPath id="bh-c01"><rect x="0" y="80" width="80" height="80" /></clipPath>
          <clipPath id="bh-c11"><rect x="80" y="80" width="80" height="80" /></clipPath>
          <clipPath id="bh-c21"><rect x="160" y="80" width="80" height="80" /></clipPath>
          <clipPath id="bh-c02"><rect x="0" y="160" width="80" height="80" /></clipPath>
          <clipPath id="bh-c12"><rect x="80" y="160" width="80" height="80" /></clipPath>
          <clipPath id="bh-c22"><rect x="160" y="160" width="80" height="80" /></clipPath>
        </defs>

        <rect x="0" y="0" width="80" height="80" fill="#000" />

        <g clip-path="url(#bh-c10)">
          <circle cx="80" cy="0" r="80" fill="var(--ss-destaque)" />
        </g>

        <g clip-path="url(#bh-c20)">
          <circle cx="200" cy="80" r="40" fill="var(--ss-secundario)" />
        </g>

        <g clip-path="url(#bh-c01)">
          <circle cx="80" cy="120" r="40" fill="var(--ss-secundario)" />
        </g>

        <g clip-path="url(#bh-c11)">
          <circle cx="160" cy="160" r="80" fill="var(--ss-destaque-escuro)" />
        </g>

        <g clip-path="url(#bh-c21)">
          <circle cx="160" cy="160" r="80" fill="var(--ss-destaque)" />
        </g>

        <polygon points="0,240 80,240 80,160" fill="#000" />

        <rect x="80" y="160" width="80" height="80" fill="var(--ss-fundo-suave)" stroke="var(--ss-borda)" />

        <g clip-path="url(#bh-c22)">
          <circle cx="240" cy="160" r="80" fill="var(--ss-destaque-escuro)" />
        </g>
      </svg>
  </div>

  <header>
    <div class="cabecalho-marca">
      <svg class="marca-bauhaus" viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">
        <circle cx="13" cy="13" r="10" fill="var(--ss-destaque)" />
        <rect x="19" y="19" width="16" height="16" fill="#000" />
        <polygon points="31,3 39,19 23,19" fill="none" stroke="#000" stroke-width="2" />
      </svg>
      <strong>Subsight</strong>
    </div>
    <nav id="nav-logado" hidden>
      <a href="criar.html">Novo documento</a>
      <button type="button" class="secundario" id="btn-sair" style="margin:0">Sair</button>
    </nav>
  </header>

  <main>
    <div id="area-login" class="painel" style="max-width:360px">
      <h2>Entrar</h2>
      <form id="form-login">
        <label for="email">Email de login</label>
        <input id="email" type="email" required />
        <label for="senha">Senha</label>
        <input id="senha" type="password" required />
        <button type="submit" class="destaque">Entrar</button>
        <p class="msg" id="msg-login"></p>
      </form>
    </div>

    <div id="area-dashboard" hidden>
      <div class="topo-pagina">
        <h1>Meus documentos</h1>
        <a href="criar.html" class="botao destaque">
          <img class="icone" src="web/icons/upload-01.svg" alt="" />
          Novo documento
        </a>
      </div>

      <div class="painel">
        <table>
          <thead>
            <tr><th>Tipo</th><th>Estado</th><th>Criado em</th><th></th></tr>
          </thead>
          <tbody id="corpo-documentos">
            <tr><td colspan="4" class="vazio">A carregar…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://projetoempresaficticia.github.io/pp-base/web/comum.js"></script>
  <script src="app.js"></script>
</body>
</html>
