<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="pc-versao" content="675641efc78e" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subsight</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#FF7F00" />
  <link rel="stylesheet" href="web/estilos.css?v=11e1ecb3" />
  <script src="web/atualizar.js?v=11b8f9b4"></script>
</head>
<body>
  <header>
    <div class="cabecalho-marca">
      <div class="icone-app" aria-hidden="true">
        <picture>
          <source srcset="web/marca/subsight-marca.webp" type="image/webp" />
          <img src="web/marca/subsight-marca.png" alt="" width="63" height="38" />
        </picture>
      </div>
      <strong>Subsight</strong>
    </div>
    <nav id="nav-logado" hidden>
      <a href="criar.html">Novo documento</a>
      <button type="button" class="secundario" id="btn-sair" style="margin:0">Sair</button>
    </nav>
  </header>

  <main>
    <div id="area-login" class="hero-entrar">
      <div class="hero-entrar-conteudo">
        <p class="hero-entrar-eyebrow">Assinatura digital para empresas</p>
        <h1 class="hero-entrar-titulo">Assine com confiança</h1>
        <div class="hero-entrar-form">
          <h2>Entrar</h2>
          <form id="form-login">
            <label for="email">Email de login</label>
            <input id="email" type="email" required />
            <label for="senha">Senha</label>
            <input id="senha" type="password" required />
            <button type="submit" class="destaque">Entrar</button>
            <p class="msg" id="msg-login"></p>
          </form>
        </div>
      </div>
    </div>

    <div id="area-dashboard" hidden>
      <div class="topo-pagina">
        <h1>Meus documentos</h1>
        <a href="criar.html" class="botao destaque">
          <img class="icone" src="web/icons/upload-01.svg" alt="" />
          Novo documento
        </a>
      </div>

      <div class="painel">
        <table>
          <thead>
            <tr><th>Tipo</th><th>Estado</th><th>Criado em</th><th></th></tr>
          </thead>
          <tbody id="corpo-documentos">
            <tr><td colspan="4" class="vazio">A carregar…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://projetoempresaficticia.github.io/pp-base/web/comum.js"></script>
  <script src="app.js?v=57745772"></script>
</body>
</html>
