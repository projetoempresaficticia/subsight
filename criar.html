<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="pc-versao" content="4b4c9d4cfe13" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subsight — Novo documento</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#FF7F00" />
  <link rel="stylesheet" href="web/estilos.css?v=5fc32ed2" />
  <script src="web/atualizar.js?v=11b8f9b4"></script>
</head>
<body>
  <header>
    <div class="cabecalho-marca">
      <div class="icone-app" aria-hidden="true">
        <img src="web/marca/subsight-marca.png" alt="" width="63" height="38" />
      </div>
      <strong>Subsight</strong>
    </div>
    <nav>
      <a href="index.html">← Meus documentos</a>
    </nav>
  </header>

  <main>
    <div id="area-login" class="painel" style="max-width:360px">
      <h2>Entrar</h2>
      <form id="form-login">
        <label for="email">Email de login</label>
        <input id="email" type="email" required />
        <label for="senha">Senha</label>
        <input id="senha" type="password" required />
        <button type="submit" class="destaque">Entrar</button>
        <p class="msg" id="msg-login"></p>
      </form>
    </div>

    <div id="area-criar" hidden>
      <h1>Novo documento</h1>

      <form id="form-criar" class="painel">
        <label for="tipo">Tipo de documento</label>
        <select id="tipo" required></select>

        <label for="arquivo">Documento (PDF)</label>
        <input id="arquivo" type="file" accept="application/pdf" required />

        <div id="slots-dinamicos"></div>

        <button type="submit" class="destaque" id="btn-criar">
          <img class="icone" src="web/icons/upload-01.svg" alt="" />
          Enviar e criar documento
        </button>
        <p class="msg" id="msg-criar"></p>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://projetoempresaficticia.github.io/pp-base/web/comum.js"></script>
  <script src="criar.js?v=060958d6"></script>
</body>
</html>
